manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Switch the `zmk` project below to this remote (and revision: lipo-curve)
    # after forking zmkfirmware/zmk and applying patches/0001-lipo-curve.patch.
    - name: keeper-of-memes
      url-base: https://github.com/keeper-of-memes
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # After forking MechboardsLTD/zmk-module and applying
    # patches/0002-nv-gem-lvgl9.patch, change `url` below to point at your
    # fork and `revision` to `nv_gem_lvgl9`. Until then the build will
    # fail because the upstream nv_gem branch is LVGL-8-only.
    - name: nv-gem
      url: https://github.com/MechboardsLTD/zmk-module
      revision: nv_gem
  self:
    path: config