manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Switch the `zmk` project below to this remote (and revision: lipo-curve)
    # after forking zmkfirmware/zmk and applying patches/0001-lipo-curve.patch.
    - name: keeper-of-memes
      url-base: https://github.com/keeper-of-memes
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to a known-good commit (the last one before this repo's last
      # successful build on 2025-11-25). Tracking `main` was breaking builds
      # because of ZMK's in-flight HWMv2 board reorganisation.
      revision: e34793e8c71990bf08be7ff67900f6a8d04f97e3
      import: app/west.yml
    - name: nv-gem
      url: https://github.com/MechboardsLTD/zmk-module
      revision: nv_gem
  self:
    path: config