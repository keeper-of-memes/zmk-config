manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Switch the `zmk` project below to this remote (and revision: lipo-curve)
    # after forking zmkfirmware/zmk and applying patches/0001-lipo-curve.patch.
    - name: keeper-of-memes
      url-base: https://github.com/keeper-of-memes
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # nice_view_gem shield used to come from MechboardsLTD/zmk-module:nv_gem
    # but that branch is LVGL-8-only and breaks under Zephyr 4.1 / LVGL 9.
    # A patched copy now lives directly in this repo under
    # boards/shields/nice_view_gem/ — see CHANGES.md.
  self:
    path: config