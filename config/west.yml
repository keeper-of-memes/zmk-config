manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Switch the `zmk` project below to this remote (and revision: lipo-curve)
    # after forking zmkfirmware/zmk and applying patches/0001-lipo-curve.patch.
    - name: keeper-of-memes
      url-base: https://github.com/keeper-of-memes
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: nv-gem
      url: https://github.com/MechboardsLTD/zmk-module
      revision: nv_gem
  self:
    path: config