CONFIG_ZMK_RGB_UNDERGLOW=n
# CONFIG_WS2812_STRIP removed: the symbol no longer exists in Zephyr 4,
# so assigning to it (even =n) is a hard Kconfig error. The WS2812
# driver is now selected transitively via CONFIG_LED_STRIP when
# CONFIG_ZMK_RGB_UNDERGLOW is enabled.

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_NICE_VIEW_GEM_ANIMATION=y

CONFIG_ZMK_IDLE_TIMEOUT=120000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

CONFIG_ZMK_EXT_POWER=y
