CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Blank the nice!view while the keyboard is idle to drop SPI traffic to zero.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Avoid the redraws/animation work on the gem screen.
CONFIG_NICE_VIEW_GEM_ANIMATION=n

CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=y

# Drop the radio back to the nRF52 default (0 dBm). +8 dBm was using
# roughly 6x the TX current with no measured range benefit.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Power management: idle the MCU after 30s, deep sleep after 15min, and
# allow ext_power to gate the auxiliary rails (display, future LEDs).
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y
