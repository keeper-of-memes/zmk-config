# --- Display ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# --- Encoder ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- RGB underglow ---
# (CONFIG_ZMK_RGB_UNDERGLOW selects LED_STRIP/WS2812 automatically; no need
# to enable WS2812_STRIP explicitly — that symbol was removed in Zephyr 4.x.)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# --- External power control (gates LED/display rail in sleep) ---
CONFIG_ZMK_EXT_POWER=y

# --- Idle (display-off) and deep-sleep timeouts ---
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Studio is enabled per-build via build.yaml cmake-args (left half only) ---
CONFIG_ZMK_STUDIO_LOCKING=n
